[project]
name = "healthtech-market-landscape-boston"
version = "0.1.0"
description = "Workflow: build a market map of Boston-area healthcare and health tech companies."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "workflow-lab[db,llm,storage]",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
workflow-lab = { workspace = true }
