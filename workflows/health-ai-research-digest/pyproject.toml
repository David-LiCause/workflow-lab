[project]
name = "health-ai-research-digest"
version = "0.1.0"
description = "Workflow: a weekly digest of new health AI papers from arXiv, structured by Claude."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "workflow-lab[db,llm,storage]",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
workflow-lab = { workspace = true }
