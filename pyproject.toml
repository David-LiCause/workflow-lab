# Workspace root: not a package itself. Members are listed below; each has its own pyproject.toml.
# Set up everything with: uv sync --all-packages

[tool.uv.workspace]
members = ["packages/*", "workflows/*", "apps/*"]

[tool.uv.sources]
workflow-lab = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/*/tests", "workflows/*/tests", "apps/*/tests"]
# importlib mode lets members have test files with the same name.
addopts = "-m 'not integration' --import-mode=importlib"  # run them with: pytest -m integration
markers = ["integration: calls a real external service or browser; deselected by default"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["packages/*/src", "packages/*/tests", "workflows/*/src", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# marimo writes every SQL cell as an f-string, even without placeholders.
"notebooks/*" = ["F541"]

[dependency-groups]
dev = [
    "duckdb>=2.0.1",
    "langgraph-cli[inmem]>=0.4.43",
    "marimo>=0.26.0",
    "polars>=2.2.0",
    "psycopg[binary]>=3.3.9",
    "pytest>=8",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.6",
    "sqlglot>=30.35.0",
    "workflow-lab[db,llm,scraper,storage]",
]
